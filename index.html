let tool = "calc", method = "v60", calc = { dose:15, ratio:R.v60.water/R.v60.dose };
function viewTools(){
  return `<div class="wrap" style="max-width:980px">
    <div class="eyebrow">Ferramentas do barista</div>
    <h1 style="font-size:clamp(30px,4vw,42px);margin:6px 0 4px">Sua bancada digital</h1>
    <p class="lede" style="font-size:18px">Use enquanto prepara: monte a receita, siga o timer e corrija o sabor.</p>
    <div class="tools-tabs" role="tablist">
      ${[["calc","Calculadora de receita"],["timer","Timer guiado"],["diag","Diagnóstico da xícara"],["gloss","Glossário"]].map(([k,t])=>`<button role="tab" aria-selected="${tool===k}" data-tool="${k}">${t}</button>`).join("")}
    </div>
    <div id="toolBody"></div></div>`;
}
function methodChips(){
  return `<div class="chips">${Object.entries(R).map(([k,r])=>`<button class="chip" aria-pressed="${method===k}" data-method="${k}">${r.name}</button>`).join("")}</div>`;
}
function renderTool(){
  const b = $("#toolBody"); if(!b) return;
  document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-selected", x.dataset.tool===tool));
  stopTimer(false);
  if(tool==="calc"){
    const r=R[method];
    b.innerHTML = methodChips()+`<div class="calc">
      <div class="panel">
        <div class="field"><label for="dose">Café (g)</label><div class="stepper"><button type="button" data-d="-1" aria-label="Menos 1 grama">−</button><input id="dose" type="number" min="5" max="120" step="1" value="${calc.dose}"><button type="button" data-d="1" aria-label="Mais 1 grama">+</button></div></div>
        <div class="field"><label for="ratio">Proporção: <span id="rlab"></span></label><input id="ratio" type="range" min="12" max="18" step="0.5" value="${calc.ratio}"><div class="row mono" style="justify-content:space-between;font-size:13px;color:var(--muted)"><span>1:12 forte</span><span>1:18 suave</span></div></div>
        <div class="field"><label for="cups">Ou escolha pelas xícaras (150 ml)</label><div class="chips" id="cups" style="margin:0">${[1,2,3,4].map(n=>`<button class="chip" type="button" data-cups="${n}">${n}</button>`).join("")}</div></div>
      </div>
      <div class="panel">
        <div class="field"><label>Água total</label><div class="big" id="oWater"></div></div>
        <div class="out">
          <div><span>Bloom</span><b id="oBloom"></b></div>
          <div><span>Café na xícara (aprox.)</span><b id="oBev"></b></div>
          <div><span>Moagem</span><b style="font-size:18px">${r.grind}</b></div>
          <div><span>Temperatura</span><b style="font-size:18px">${r.temp}</b></div>
        </div>
        <p style="font-size:15px;color:var(--muted);margin:16px 0 12px">O pó segura cerca de 2 g de água para cada 1 g de café, por isso sai menos bebida do que a água que você coloca.</p>
        <a class="btn" href="#ferramentas" id="toTimer">Preparar no timer</a>
      </div></div>`;
    const upd=()=>{ const w=Math.round(calc.dose*calc.ratio); $("#rlab").textContent="1:"+String(calc.ratio).replace(".",","); $("#oWater").innerHTML=w+" <small>g</small>"; $("#oBloom").textContent=Math.round(calc.dose*2.5)+" g"; $("#oBev").textContent=Math.max(0,w-calc.dose*2)+" ml"; };
    $("#dose").oninput=e=>{ calc.dose=Math.min(120,Math.max(5,+e.target.value||5)); upd(); };
    b.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{ calc.dose=Math.min(120,Math.max(5,calc.dose+ +x.dataset.d)); $("#dose").value=calc.dose; upd(); });
    $("#ratio").oninput=e=>{ calc.ratio=+e.target.value; upd(); };
    b.querySelectorAll("[data-cups]").forEach(x=>x.onclick=()=>{ const bev=150*+x.dataset.cups; calc.dose=Math.round(bev/(calc.ratio-2)); $("#dose").value=calc.dose; upd(); });
    $("#toTimer").onclick=e=>{ e.preventDefault(); tool="timer"; renderTool(); };
    upd();
  }
  if(tool==="timer"){
    b.innerHTML = methodChips()+`<div class="timer"><div class="panel">
      <div class="mono" style="color:var(--muted);font-size:14px" id="tInfo"></div>
      <div class="clock" id="clock" aria-live="off">0:00</div>
      <div class="now" id="now" aria-live="polite"></div>
      <div class="row"><button class="btn" id="tStart">Iniciar</button><button class="btn ghost" id="tReset">Zerar</button></div>
      <label class="row" style="margin-top:14px;font-size:15px;gap:8px" for="beep"><input type="checkbox" id="beep" checked style="accent-color:var(--cherry)"> Aviso sonoro a cada etapa</label>
    </div><div class="panel"><h3 style="font-size:20px;margin-bottom:8px">Etapas</h3><ul class="steps-list" id="stepsList"></ul></div></div>`;
    setupTimer();
  }
  if(tool==="diag"){
    b.innerHTML = `<p style="margin-top:0">Como está o seu café? Escolha o que mais parece com a sua xícara.</p><div class="diag-btns">${DIAG.map(d=>`<button aria-pressed="false" data-dg="${d.k}"><b>${d.b}</b><span>${d.s}</span></button>`).join("")}</div><div class="panel diag-out" id="dgOut"><p style="margin:0;color:var(--muted)">Escolha um sintoma acima para ver a causa e o ajuste.</p></div>`;
    b.querySelectorAll("[data-dg]").forEach(x=>x.onclick=()=>{ b.querySelectorAll("[data-dg]").forEach(y=>y.setAttribute("aria-pressed",y===x)); const d=DIAG.find(z=>z.k===x.dataset.dg);
      $("#dgOut").innerHTML=`<div class="eyebrow">Diagnóstico</div><h3>${d.cause}</h3><p><b>O que fazer, nesta ordem:</b></p><ol>${d.fix.map(f=>`<li>${f}</li>`).join("")}</ol><div class="callout tip" style="margin-bottom:0"><span class="ic">Dica</span><p>${d.m} Mude uma coisa por vez e prove de novo.</p></div>`; });
  }
  if(tool==="gloss"){
    b.innerHTML = `<label for="gq" style="position:absolute;left:-9999px">Buscar termo</label><input class="search" id="gq" placeholder="Buscar termo, por exemplo: bloom" autocomplete="off"><dl class="gl" id="gl"></dl>`;
    const draw=q=>{ q=(q||"").toLowerCase(); $("#gl").innerHTML=GLOSS.filter(g=>!q||g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q)).map(g=>`<div><dt>${g[0]}</dt><dd>${g[1]}</dd></div>`).join("")||"<p>Nenhum termo encontrado.</p>"; };
    $("#gq").oninput=e=>draw(e.target.value); draw("");
  }
  b.querySelectorAll("[data-method]").forEach(x=>x.onclick=()=>{ method=x.dataset.method; const r=R[method]; calc.dose=r.dose; calc.ratio=Math.round(r.water/r.dose*2)/2; renderTool(); });
}

let T = { run:false, t0:0, el:0, h:null, lastStep:-1, ctx:null };
function stepsFor(){ const r=R[method]; const k=Math.round(calc.dose*calc.ratio)/r.water; return r.steps.map(s=>Object.assign({},s,{to:s.to?Math.round(s.to*k):null})); }
function setupTimer(){
  const r=R[method]; const st=stepsFor();
  $("#tInfo").textContent = `${r.name} · ${calc.dose} g de café · ${Math.round(calc.dose*calc.ratio)} g de água · ${r.grind} · ${r.temp}`;
  $("#stepsList").innerHTML = st.map((s,i)=>`<li data-i="${i}"><span class="t">${fmt(s.t)}</span><span><b>${s.b}</b><br><span style="font-size:15px;color:var(--muted)">${s.n}</span></span><span class="g">${s.to?s.to+" g":""}</span></li>`).join("");
  $("#tStart").onclick=()=>{ if(T.run) stopTimer(true); else startTimer(); };
  $("#tReset").onclick=()=>{ stopTimer(false); T.el=0; T.lastStep=-1; tick(); };
  T.el=0; T.lastStep=-1; tick();
}
function beep(){ if(!$("#beep")||!$("#beep").checked) return; try{ T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)(); const o=T.ctx.createOscillator(), g=T.ctx.createGain(); o.frequency.value=880; g.gain.value=.12; o.connect(g); g.connect(T.ctx.destination); o.start(); o.stop(T.ctx.currentTime+.18);}catch(e){} }
function startTimer(){ try{ T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)(); T.ctx.resume&&T.ctx.resume(); }catch(e){}
  T.run=true; T.t0=performance.now()-T.el*1000; $("#tStart").textContent="Pausar"; T.h=setInterval(()=>{ T.el=(performance.now()-T.t0)/1000; tick(); },200); }
function stopTimer(keep){ if(T.h) clearInterval(T.h); T.h=null; T.run=false; const b=$("#tStart"); if(b) b.textContent = keep&&T.el>0?"Continuar":"Iniciar"; }
function tick(){
  const st=stepsFor(); const c=$("#clock"); if(!c) return;
  c.textContent=fmt(T.el);
  let cur=0; st.forEach((s,i)=>{ if(T.el>=s.t) cur=i; });
  if(cur!==T.lastStep){ if(T.lastStep>=0) beep(); T.lastStep=cur;
    const s=st[cur], nx=st[cur+1];
    $("#now").innerHTML=`<span>${s.end?"Finalizado":"Agora"}</span><b>${s.b}${s.to?` até ${s.to} g`:""}</b><p>${s.n}</p>${nx?`<p class="mono" style="font-size:14px;margin-top:8px;color:var(--muted)">Próximo: ${nx.b} em ${fmt(nx.t)}</p>`:""}`;
    document.querySelectorAll("#stepsList li").forEach((li,i)=>{ li.classList.toggle("past",i<cur); li.classList.toggle("cur",i===cur); });
    if(s.end && T.run) stopTimer(false);
  }
}

function viewCert(){
  const ok = eligible();
  return `<div class="wrap">
    <div class="eyebrow">Certificado</div>
    <h1 style="font-size:clamp(30px,4vw,42px);margin:6px 0 10px">${ok?"Parabéns, você concluiu o curso":"Seu certificado"}</h1>
    <p class="lede" style="font-size:18px">${ok?"Digite seu nome como quer que apareça e escolha o idioma.":"Conclua todas as aulas e os testes dos módulos 1 a 8 para emitir o certificado. O bônus de espresso é opcional."}</p>
    <ul class="req">${REQ.map(m=>{const d=m.lessons.every(l=>S.done[l.id]);const q=quizPassed(m);return `<li><span class="chk ${d&&q?"on":""}"></span><span>Módulo ${m.n} · ${esc(m.title)}</span><span class="mono" style="margin-left:auto;font-size:13px;color:var(--muted)">${m.lessons.filter(l=>S.done[l.id]).length}/${m.lessons.length} aulas · teste ${q?"ok":"pendente"}</span></li>`}).join("")}</ul>
    <div class="row" style="margin-bottom:6px">
      <label for="certName" style="position:absolute;left:-9999px">Nome no certificado</label>
      <input class="namein" id="certName" placeholder="Seu nome completo" value="${esc(S.name)}" ${ok?"":"disabled"}>
      <div class="lang" role="group" aria-label="Idioma do certificado"><button data-lang="pt" aria-pressed="${S.lang==="pt"}">Português</button><button data-lang="en" aria-pressed="${S.lang==="en"}">English</button></div>
      <button class="btn" id="certGo" ${ok?"":"disabled"}>Gerar certificado</button>
      ${ok?"":`<button class="btn ghost" id="certSample">Ver modelo</button>`}
    </div>
    <p style="font-size:15px;color:var(--muted)">Para salvar, toque e segure na imagem (celular) ou clique com o botão direito e escolha salvar imagem (computador).</p>
    <div id="certOut"></div></div>`;
}
function drawCert(name, lang, sample){
  const W=1600,H=1130,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const ink="#16120F", red="#A4282C";
  x.fillStyle="#FBFAF7"; x.fillRect(0,0,W,H);
  x.strokeStyle=ink; x.lineWidth=10; x.strokeRect(40,40,W-80,H-80); x.lineWidth=2; x.strokeRect(62,62,W-124,H-124);
  try{ x.drawImage(LOGO,W/2-90,100,180,180); }catch(e){}
  const T = lang==="en" ? {h:"CERTIFICATE OF COMPLETION",a:"This certifies that",b:"has successfully completed the online course",c:"Barista at Home",d:`Home brewing for beginners · ${ALL.length} lessons · approx. ${Math.round(totalMin/60)} hours`,e:"Instructor",f:"Date"}
                         : {h:"CERTIFICADO DE CONCLUSÃO",a:"Certificamos que",b:"concluiu com aproveitamento o curso online",c:"Barista em Casa",d:`Métodos de preparo para iniciantes · ${ALL.length} aulas · cerca de ${Math.round(totalMin/60)} horas`,e:"Instrutor",f:"Data"};
  x.textAlign="center"; x.fillStyle=red; x.font="700 30px 'Courier Prime', monospace"; x.fillText(T.h,W/2,335);
  x.fillStyle=ink; x.font="400 34px 'Source Sans 3', sans-serif"; x.fillText(T.a,W/2,420);
  let fs=86; x.font=`400 ${fs}px 'Alfa Slab One', serif`; while(x.measureText(name).width>W-260 && fs>40){ fs-=4; x.font=`400 ${fs}px 'Alfa Slab One', serif`; }
  x.fillText(name,W/2,530);
  x.fillRect(W/2-380,560,760,2);
  x.font="400 34px 'Source Sans 3', sans-serif"; x.fillText(T.b,W/2,635);
  x.font="700 62px 'Zilla Slab', serif"; x.fillStyle=red; x.fillText(T.c,W/2,715);
  x.fillStyle=ink; x.font="400 28px 'Courier Prime', monospace"; x.fillText(T.d,W/2,775);
  const d=new Date(); const ds = lang==="en"? d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}) : d.toLocaleDateString("pt-BR",{year:"numeric",month:"long",day:"numeric"});
  x.font="700 38px 'Zilla Slab', serif"; x.fillText(COURSE.instructor,W/2-330,930); x.fillText(ds,W/2+330,930);
  x.fillRect(W/2-530,880,400,2); x.fillRect(W/2+130,880,400,2);
  x.font="400 26px 'Courier Prime', monospace"; x.fillStyle="#5E5751"; x.fillText(T.e+" · "+COURSE.school,W/2-330,970); x.fillText(T.f,W/2+330,970);
  x.font="400 22px 'Courier Prime', monospace"; x.fillText("Bilu Coffee · Escola do Barista · Santo André - SP · escoladobarista.com.br",W/2,1040);
  if(sample){ x.save(); x.translate(W/2,H/2); x.rotate(-.35); x.fillStyle="rgba(164,40,44,.16)"; x.font="400 220px 'Alfa Slab One', serif"; x.fillText(lang==="en"?"SAMPLE":"MODELO",0,60); x.restore(); }
  return c.toDataURL("image/png");
}
function bindCert(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ S.lang=b.dataset.lang; save(); document.querySelectorAll("[data-lang]").forEach(y=>y.setAttribute("aria-pressed",y===b)); });
  const out=$("#certOut");
  const show=(name,sample)=>{ const go=()=>{ out.innerHTML=`<img class="cert-img" alt="Certificado de ${esc(name)}" src="${drawCert(name,S.lang,sample)}">`; }; (document.fonts&&document.fonts.ready?document.fonts.ready.then(go):go()); };
  const n=$("#certName"); if(n) n.oninput=()=>{ S.name=n.value; save(); };
  const g=$("#certGo"); if(g) g.onclick=()=>{ const v=(n.value||"").trim(); if(!v){ out.innerHTML=`<p class="score fail">Digite seu nome para gerar o certificado.</p>`; n.focus(); return; } show(v,false); };
  const s=$("#certSample"); if(s) s.onclick=()=>show("Nome do Aluno",true);
}

/* ============================================================
   ROTEAMENTO
   ============================================================ */
function route(){
  const h = (location.hash||"#inicio").slice(1);
  const main=$("#main"); let html, bind=()=>{}, nav="inicio";
  if(h.startsWith("aula-")){ const id=h.slice(5); html=viewLesson(id); bind=()=>bindLesson(id); nav=""; }
  else if(h.startsWith("teste-")){ const id=h.slice(6); html=viewQuiz(id); bind=()=>bindQuiz(id); nav=""; }
  else if(h==="ferramentas"){ html=viewTools(); nav="ferramentas"; bind=()=>{ document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;renderTool();}); renderTool(); }; }
  else if(h==="certificado"){ html=viewCert(); nav="certificado"; bind=bindCert; }
  else { html=viewHome(); }
  if(!h.startsWith("ferramentas")) stopTimer(false);
  main.innerHTML=html; bind();
  main.querySelectorAll("[data-timer]").forEach(a=>a.addEventListener("click",()=>{ const k=a.dataset.timer; method=k; calc.dose=R[k].dose; calc.ratio=Math.round(R[k].water/R[k].dose*2)/2; tool="timer"; if(location.hash==="#ferramentas") renderTool(); }));
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current", a.dataset.nav===nav) || a.dataset.nav===nav && a.setAttribute("aria-current","page"));
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderSide(h);
  document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
$("#menuBtn").onclick=()=>{ const o=document.body.classList.toggle("nav-open"); $("#menuBtn").setAttribute("aria-expanded",o); };
$("#backdrop").onclick=()=>{ document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded","false"); };
window.addEventListener("hashchange",route);
route();
</script>
